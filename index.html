<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola de sonido D&D</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16201f;--panel:#213130;--panel2:#2a3d3b;--line:#38504d;--text:#e6e1d3;--mut:#9fb0aa;--gold:#d9a441;--w:400px;--th:36px}
body[data-size=s]{--w:300px;--th:0px}
body[data-size=l]{--w:560px;--th:54px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.3 system-ui,sans-serif;padding:14px}
button,select,input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit;padding:6px 10px;cursor:pointer}
input[type=text]{cursor:text;width:100%}
button:hover{border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.main{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:600}
input[type=range]{accent-color:var(--gold);min-width:0}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
h1{font:700 22px Spectral,Georgia,serif;margin:0 auto 0 0}
header label{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}
header input[type=range]{width:90px}
#now{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;color:var(--mut);font-size:12px}
#now[hidden]{display:none}
.chip{background:var(--panel2);border-color:var(--gold);padding:3px 9px;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.cats{border-bottom:1px solid var(--line);margin-bottom:8px}
.cats .tab{font:700 17px Spectral,Georgia,serif;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 14px;color:var(--mut)}
.cats .tab.act{color:var(--text);border-bottom-color:var(--gold)}
.subs{margin-bottom:12px}
.subs .tab{border-radius:99px;padding:3px 12px;font-size:13px;color:var(--mut)}
.subs .tab.act{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.tab.over{outline:2px dashed var(--gold)}
.tab.add{border-style:dashed;background:none}
#panes{display:grid;grid-template-columns:repeat(var(--np,1),minmax(0,1fr));gap:14px;align-items:start}
.pane{min-width:0}
body:not([data-np="1"]) .pane{background:rgba(0,0,0,.14);border:1px solid var(--line);border-radius:8px;padding:8px}
body:not([data-np="1"]) .cats .tab{font-size:15px;padding:5px 9px}
body[data-np="3"] .th,body[data-np="3"] .tm{display:none}
@media(max-width:760px){#panes{grid-template-columns:1fr}}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--w),100%),1fr));gap:6px}
.row{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:4px 6px;min-height:calc(var(--th) + 10px)}
.row.on{border-left-color:var(--gold);background:var(--panel2)}
.row.over{outline:2px dashed var(--gold)}.row.drag{opacity:.4}.row.bad{opacity:.55}
.gp{cursor:grab;color:var(--mut);padding:0 2px;user-select:none}
.th{width:calc(var(--th)*1.78);height:var(--th);object-fit:cover;border-radius:3px;flex:none}
body[data-size=s] .th{display:none}
.nm{flex:0 0 clamp(90px,22%,170px);min-width:0}
.nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--mut);font-size:11px}
.row button{padding:3px 8px;line-height:1.2;flex:none}
.pl{min-width:32px}
.seek{flex:1 1 60px;display:flex;align-items:center;gap:6px;min-width:50px}
.seek input{flex:1;width:100%;height:14px}
.tm{font-size:11px;color:var(--mut);white-space:nowrap}
body[data-size=s] .tm{display:none}
.vl{width:76px;flex:none}
.empty{grid-column:1/-1;color:var(--mut);padding:28px;border:1px dashed var(--line);border-radius:8px;text-align:center}
#msg{color:#e59a8e;min-height:1em;margin-bottom:6px;font-size:13px}
.kb{border:1px solid var(--gold);color:var(--gold);border-radius:3px;padding:0 4px;font-size:10px;margin-left:4px}
#scenes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.scn{border-color:var(--gold);border-radius:99px;padding:4px 12px}
.sx{padding:2px 6px!important;margin-left:-4px;border-radius:99px;color:var(--mut)}
#pool{position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:10px;padding:18px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font:700 20px Spectral,Georgia,serif;margin:0 0 12px}
dialog label{display:block;margin-bottom:10px;color:var(--mut);font-size:12px}
dialog select{width:100%;margin-top:3px}dialog input[type=text]{margin-top:3px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
</style>
</head>
<body data-size="m">
<header>
  <h1>Consola de sonido</h1>
  <label>Master <input type="range" id="master" min="0" max="100"></label>
  <label>Fade <select id="fade"><option value="0">0 s (corte)</option><option value="1">1 s</option><option value="3">3 s</option><option value="6">6 s</option><option value="10">10 s</option></select></label>
  <label>Paneles <select id="np"><option>1</option><option>2</option><option>3</option></select></label>
  <label>Tamaño <select id="sz"><option value="s">Compacto</option><option value="m">Normal</option><option value="l">Grande</option></select></label>
  <input type="text" id="q" placeholder="Buscar ( / )" style="width:150px" aria-label="Buscar pista">
  <button class="main" id="addBtn">+ Pista</button>
  <button id="stopAll">Pausar todo</button>
  <button id="exp">Exportar</button>
  <label class="btn" style="cursor:pointer"><span style="border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel);color:var(--text)">Importar</span><input type="file" id="imp" accept="application/json" hidden></label>
</header>
<div id="msg"></div>
<div id="now" hidden><span>Sonando (tocá para apagar con fade):</span><span id="chips" class="tabs"></span></div>
<div id="scenes"></div>
<div id="panes"></div>
<div id="pool"></div>

<dialog id="dlg">
  <h2 id="dt"></h2>
  <label id="fu">Link de YouTube<input type="text" id="url" placeholder="https://youtu.be/…"></label>
  <label>Nombre (opcional)<input type="text" id="nm"></label>
  <label>Categoría<select id="cat"></select></label>
  <label>Subcategoría<select id="sub"></select></label>
  <label>Tipo<select id="md"><option value="loop">Loop (play / pausa)</option><option value="once">One-shot (cada click lo dispara)</option></select></label>
  <label>Atajo de teclado (opcional)<input type="text" id="kb" readonly placeholder="Tocá acá y apretá una tecla (Backspace borra)"></label>
  <div id="e2" style="color:#e59a8e;font-size:12px;min-height:1em"></div>
  <div class="acts"><button id="del" style="margin-right:auto">Eliminar</button><button id="cx">Cancelar</button><button class="main" id="ok">Guardar</button></div>
</dialog>

<script>
const KEY='dnd-consola-v2';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){
  S={cats:{'Música':['Chill','Batalla','Épica','Taberna'],'Ambiente':['Lluvia','Naturaleza','Ciudad','Dungeon'],'FX one-shot':['Combate','Magia','Objetos','Criaturas']},tracks:[],master:80,size:'m',fade:3};
  try{(JSON.parse(localStorage.getItem('dnd-consola-v1'))||[]).forEach(o=>S.tracks.push({id:o.id,vid:o.vid,start:o.start||0,name:o.name,auto:o.auto,vol:o.vol,mode:o.loop?'loop':'once',cat:'Música',sub:'Chill'}))}catch(e){}
}
S.panes=S.panes||[{cat:Object.keys(S.cats)[0],sub:'*'}];
S.scenes=S.scenes||[];
fixPanes();
let ap=0,dragId=null,apiReady=false,searching=false;
const AP=()=>S.panes[ap]||S.panes[0];
const kl=c=>c.replace(/^(Key|Digit)/,'');
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const players={},st={};
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eff=t=>Math.round(t.vol*S.master/100);
const byId=id=>S.tracks.find(t=>t.id===id);
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const msg=m=>{$('#msg').textContent=m};
const parseId=u=>{const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u.trim())?u.trim():null)};
const parseStart=u=>{const m=u.match(/[?&#]t=(\d+)/);return m?+m[1]:0};

/* ---------- pestañas ---------- */
function tab(label,active,fn,drop,ren,add){
  const b=document.createElement('button');b.className='tab'+(active?' act':'')+(add?' add':'');b.textContent=label;b.onclick=fn;
  if(ren){b.title='Doble click para renombrar o borrar';b.ondblclick=ren}
  if(drop){
    b.ondragover=e=>{if(dragId){e.preventDefault();b.classList.add('over')}};
    b.ondragleave=()=>b.classList.remove('over');
    b.ondrop=e=>{e.preventDefault();const t=byId(dragId);if(!t)return;t.cat=drop.cat;t.sub=drop.sub!==undefined?drop.sub:(S.cats[drop.cat][0]||'');save();render()};
  }
  return b;
}
function fixPanes(){const cs=Object.keys(S.cats);S.panes.forEach(p=>{if(!S.cats[p.cat])p.cat=cs[0];if(p.sub!=='*'&&!S.cats[p.cat].includes(p.sub))p.sub='*'})}
function renameCat(c){
  const n=prompt('Nuevo nombre (vacío = borrar, solo si no tiene pistas)',c);if(n===null)return;const k=n.trim();
  if(!k){if(S.tracks.some(t=>t.cat===c)||Object.keys(S.cats).length<2)return msg('Solo se puede borrar una categoría vacía (y tiene que quedar al menos una).');delete S.cats[c]}
  else if(k!==c&&!S.cats[k]){S.cats=Object.fromEntries(Object.entries(S.cats).map(([a,b])=>[a===c?k:a,b]));S.tracks.forEach(t=>{if(t.cat===c)t.cat=k});S.panes.forEach(p=>{if(p.cat===c)p.cat=k})}
  fixPanes();save();render();
}
function renameSub(pc,s){
  const n=prompt('Nuevo nombre (vacío = borrar, solo si no tiene pistas)',s);if(n===null)return;const k=n.trim(),arr=S.cats[pc];
  if(!k){if(S.tracks.some(t=>t.cat===pc&&t.sub===s))return msg('Solo se puede borrar una subcategoría vacía.');arr.splice(arr.indexOf(s),1)}
  else if(k!==s&&!arr.includes(k)){arr[arr.indexOf(s)]=k;S.tracks.forEach(t=>{if(t.cat===pc&&t.sub===s)t.sub=k});S.panes.forEach(p=>{if(p.cat===pc&&p.sub===s)p.sub=k})}
  fixPanes();save();render();
}
function renderTabs(pn,P,i){
  const go=(c,s)=>{if(c!==undefined)P.cat=c;P.sub=s;ap=i;save();render()};
  const ct=pn.querySelector('.cats');
  Object.keys(S.cats).forEach(c=>ct.appendChild(tab(c,c===P.cat,()=>go(c,'*'),{cat:c},()=>renameCat(c))));
  ct.appendChild(tab('+ Categoría',()=>{const n=(prompt('Nombre de la categoría')||'').trim();if(n&&!S.cats[n]){S.cats[n]=[];go(n,'*')}},null,null,true));
  const sb=pn.querySelector('.subs');
  sb.appendChild(tab('Todas',P.sub==='*',()=>go(undefined,'*')));
  S.cats[P.cat].forEach(s=>sb.appendChild(tab(s,P.sub===s,()=>go(undefined,s),{cat:P.cat,sub:s},()=>renameSub(P.cat,s))));
  sb.appendChild(tab('+ Subcategoría',()=>{const n=(prompt('Nombre de la subcategoría')||'').trim();if(n&&!S.cats[P.cat].includes(n)){S.cats[P.cat].push(n);go(undefined,n)}},null,null,true));
}

/* ---------- filas ---------- */
function row(t){
  const r=document.createElement('div');r.className='row'+(st[t.id]?.playing?' on':'')+(st[t.id]?.err?' bad':'');r.dataset.id=t.id;
  r.innerHTML=`<span class="gp" draggable="true" title="Arrastrar para ordenar o mover a otra pestaña">⠿</span>
  <img class="th" src="https://i.ytimg.com/vi/${t.vid}/default.jpg" alt="" draggable="false">
  <div class="nm"><b title="${esc(t.name)}">${esc(t.name)}</b><small>${searching?esc(t.cat)+' / ':''}${esc(t.sub||'')}${t.mode==='once'?' (one-shot)':''}${t.key?`<span class="kb">${kl(t.key)}</span>`:''}</small></div>
  <button class="pl" title="${t.mode==='once'?'Disparar':'Play / pausa'}">${st[t.id]?.playing&&t.mode!=='once'?'⏸':'▶'}</button>
  <button class="rs" title="Reiniciar">↺</button><button class="fd" title="Fade in / fade out">≋</button>${t.mode==='once'?'':'<button class="xf" title="Crossfade: baja lo demás de esta categoría y sube esta">⇄</button>'}
  <div class="seek"><input type="range" class="sk" min="0" max="1000" value="0" aria-label="Posición"><span class="tm"></span></div>
  <input type="range" class="vl" min="0" max="100" value="${t.vol}" aria-label="Volumen de ${esc(t.name)}" title="Volumen ${t.vol}%">
  <button class="ed" title="Editar">✎</button>`;
  const p=()=>players[t.id];
  r.querySelector('.pl').onclick=()=>playT(t);
  const xf=r.querySelector('.xf');if(xf)xf.onclick=()=>xfade(t);
  r.querySelector('.rs').onclick=()=>{if(p()){p().seekTo(t.start||0,true);p().playVideo()}};
  r.querySelector('.fd').onclick=()=>fade(t,st[t.id]?.playing?'out':'in');
  r.querySelector('.sk').onchange=e=>{if(p()?.getDuration)p().seekTo(p().getDuration()*e.target.value/1000,true)};
  const v=r.querySelector('.vl');v.oninput=()=>{t.vol=+v.value;v.title='Volumen '+t.vol+'%';p()?.setVolume(eff(t));save()};
  r.querySelector('.ed').onclick=()=>openDlg(t);
  const gp=r.querySelector('.gp');
  gp.ondragstart=e=>{dragId=t.id;e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.setDragImage(r,10,10);r.classList.add('drag')};
  gp.ondragend=()=>{dragId=null;document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'))};
  r.ondragover=e=>{if(dragId&&dragId!==t.id){e.preventDefault();r.classList.add('over')}};
  r.ondragleave=()=>r.classList.remove('over');
  r.ondrop=e=>{e.preventDefault();const d=byId(dragId);if(!d||d===t)return;S.tracks.splice(S.tracks.indexOf(d),1);S.tracks.splice(S.tracks.indexOf(t),0,d);d.cat=t.cat;d.sub=t.sub;save();render()};
  return r;
}
function renderPanes(){
  const g=$('#panes');g.innerHTML='';g.style.setProperty('--np',S.panes.length);document.body.dataset.np=S.panes.length;
  const q=nz($('#q').value.trim());searching=!!q;
  if(q){g.style.setProperty('--np',1);document.body.dataset.np=1;const pn=document.createElement('section');pn.className='pane';pn.innerHTML='<div class="list"></div>';
    const ls=pn.querySelector('.list'),L=S.tracks.filter(t=>nz(t.name+' '+t.cat+' '+(t.sub||'')).includes(q));
    if(!L.length)ls.innerHTML='<div class="empty">Sin resultados.</div>';L.forEach(t=>ls.appendChild(row(t)));g.appendChild(pn);return}
  S.panes.forEach((P,i)=>{
    const pn=document.createElement('section');pn.className='pane';
    pn.innerHTML='<div class="cats tabs"></div><div class="subs tabs"></div><div class="list"></div>';
    renderTabs(pn,P,i);
    const L=S.tracks.filter(t=>t.cat===P.cat&&(P.sub==='*'||t.sub===P.sub)),ls=pn.querySelector('.list');
    if(!L.length)ls.innerHTML='<div class="empty">No hay pistas acá. Tocá «+ Pista» o arrastrá una desde otra pestaña.</div>';
    L.forEach(t=>ls.appendChild(row(t)));
    g.appendChild(pn);
  });
}
function renderNow(){
  const n=S.tracks.filter(t=>st[t.id]?.playing);
  $('#now').hidden=!n.length;
  const c=$('#chips');c.innerHTML='';
  n.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t.name+' ✕';b.onclick=()=>fade(t,'out');c.appendChild(b)});
}
function render(){renderPanes();renderNow();renderScenes()}
function mark(t){
  const on=!!st[t.id]?.playing;
  document.querySelectorAll(`.row[data-id="${t.id}"]`).forEach(r=>{r.classList.toggle('on',on);r.querySelector('.pl').textContent=on&&t.mode!=='once'?'⏸':'▶'});
  renderNow();
}

/* ---------- audio ---------- */
function mount(t){
  if(players[t.id])return;
  const d=document.createElement('div');d.id='p'+t.id;$('#pool').appendChild(d);st[t.id]={};
  players[t.id]=new YT.Player(d.id,{width:200,height:200,videoId:t.vid,
    playerVars:{origin:location.origin,playsinline:1,start:t.start||0},
    events:{
      onReady:e=>{st[t.id].ready=true;e.target.setVolume(eff(t));
        if(t.auto){t.name=e.target.getVideoData().title||'Sin título';t.auto=false;save();renderPanes();renderNow()}},
      onStateChange:e=>{st[t.id].playing=e.data===1;
        if(e.data===0&&t.mode==='loop'){e.target.seekTo(t.start||0,true);e.target.playVideo()}mark(t)},
      onError:()=>{st[t.id].err=true;msg(`No se pudo cargar «${t.name}»: el video no permite reproducción embebida o no existe.`);renderPanes()}
    }});
}
function fade(t,dir){
  const p=players[t.id];if(!p||!st[t.id]?.ready)return;
  clearInterval(st[t.id].tm);
  if(!S.fade){if(dir==='in'){p.setVolume(eff(t));p.playVideo()}else{p.pauseVideo();p.setVolume(eff(t))}return}
  const target=eff(t),steps=20,ms=S.fade*1000/steps;let i=0;
  if(dir==='in'){p.setVolume(0);p.playVideo();
    st[t.id].tm=setInterval(()=>{i++;p.setVolume(target*i/steps);if(i>=steps)clearInterval(st[t.id].tm)},ms)}
  else{const v=p.getVolume();
    st[t.id].tm=setInterval(()=>{i++;p.setVolume(v*(1-i/steps));if(i>=steps){clearInterval(st[t.id].tm);p.pauseVideo();p.setVolume(target)}},ms)}
}
setInterval(()=>{
  document.querySelectorAll('.row').forEach(r=>{
    const id=r.dataset.id,p=players[id];if(!p||!st[id]?.ready)return;
    const d=p.getDuration(),c=p.getCurrentTime();if(!d)return;
    const sk=r.querySelector('.sk');if(!sk.matches(':active'))sk.value=c/d*1000;
    r.querySelector('.tm').textContent=fmt(c)+' / '+fmt(d);
  });
},500);

/* ---------- atajos, crossfade, escenas, búsqueda ---------- */
function playT(t){
  const p=players[t.id];if(!p||!st[t.id]?.ready)return;p.setVolume(eff(t));
  if(t.mode==='once'){p.seekTo(t.start||0,true);p.playVideo()}else st[t.id].playing?p.pauseVideo():p.playVideo();
}
function xfade(t){
  if(st[t.id]?.playing)return fade(t,'out');
  S.tracks.forEach(o=>{if(o!==t&&o.cat===t.cat&&o.mode!=='once'&&st[o.id]?.playing)fade(o,'out')});
  fade(t,'in');
}
function claimKey(code,owner){[...S.tracks,...S.scenes].forEach(x=>{if(x!==owner&&x.key===code)delete x.key})}
function setKeyFrom(t){const c=$('#kb').dataset.code;if(c){claimKey(c,t);t.key=c}else delete t.key}
function runScene(sc){
  const ids=new Set(sc.items.map(i=>i.id));
  S.tracks.forEach(t=>{if(!ids.has(t.id)&&st[t.id]?.playing)fade(t,'out')});
  sc.items.forEach(i=>{const t=byId(i.id);if(!t||!st[t.id]?.ready)return;t.vol=i.vol;
    document.querySelectorAll(`.row[data-id="${t.id}"] .vl`).forEach(v=>v.value=t.vol);
    st[t.id].playing?players[t.id].setVolume(eff(t)):fade(t,'in')});
  save();
}
const nowMix=()=>S.tracks.filter(t=>st[t.id]?.playing).map(t=>({id:t.id,vol:t.vol}));
function saveScene(){
  const items=nowMix();
  if(!items.length)return msg('Poné a sonar lo que quieras en la escena y después tocá «+ Guardar escena».');
  const n=(prompt('Nombre de la escena')||'').trim();if(!n)return;
  S.scenes.push({id:Date.now().toString(36),name:n,items});save();render();
}
function editScene(sc){
  const n=prompt('Nuevo nombre (vacío = borrar escena)',sc.name);if(n===null)return;
  if(!n.trim()){S.scenes=S.scenes.filter(x=>x!==sc);save();render();return}
  sc.name=n.trim();
  const k=prompt('Tecla de atajo (una letra o número; vacío = ninguna)',sc.key?kl(sc.key):'');
  if(k!==null){const c=k.trim().toUpperCase(),code=/^[A-Z]$/.test(c)?'Key'+c:/^[0-9]$/.test(c)?'Digit'+c:'';if(code){claimKey(code,sc);sc.key=code}else delete sc.key}
  const mix=nowMix();if(mix.length&&confirm('¿Reemplazar el contenido de la escena por lo que suena ahora?'))sc.items=mix;
  save();render();
}
function renderScenes(){
  const c=$('#scenes');c.innerHTML='<span style="color:var(--mut);font-size:12px">Escenas:</span>';
  S.scenes.forEach(sc=>{
    const b=document.createElement('button');b.className='scn';b.title='Activar: apaga lo demás con fade';b.textContent=sc.name;
    if(sc.key){const k=document.createElement('span');k.className='kb';k.textContent=kl(sc.key);b.appendChild(k)}
    b.onclick=()=>runScene(sc);
    const e=document.createElement('button');e.className='scn sx';e.textContent='✎';e.title='Editar escena';e.onclick=()=>editScene(sc);
    c.append(b,e);
  });
  const a=document.createElement('button');a.className='tab add';a.textContent='+ Guardar escena';a.onclick=saveScene;c.appendChild(a);
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')||$('#dlg').open||e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  const t=S.tracks.find(x=>x.key===e.code);
  if(t){e.preventDefault();e.shiftKey?xfade(t):playT(t);return}
  const sc=S.scenes.find(x=>x.key===e.code);if(sc){e.preventDefault();runScene(sc)}
});
$('#q').oninput=render;
$('#q').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';e.target.blur();render()}};
$('#kb').onkeydown=e=>{
  if(e.key==='Tab'||e.key==='Escape')return;e.preventDefault();const k=$('#kb');
  if(e.key==='Backspace'||e.key==='Delete'){k.dataset.code='';k.value='';return}
  if(/^(Key|Digit)/.test(e.code)){k.dataset.code=e.code;k.value=kl(e.code)}
};

/* ---------- diálogo agregar / editar ---------- */
function fillSubs(sel){const a=S.cats[$('#cat').value]||[];$('#sub').innerHTML=a.length?a.map(s=>`<option>${esc(s)}</option>`).join(''):'<option value="">(sin subcategoría)</option>';if(sel!==undefined)$('#sub').value=sel}
function openDlg(t){
  const d=$('#dlg');d.dataset.id=t?t.id:'';$('#e2').textContent='';
  $('#dt').textContent=t?'Editar pista':'Nueva pista';
  $('#fu').hidden=!!t;$('#del').hidden=!t;$('#url').value='';$('#nm').value=t?t.name:'';
  $('#cat').innerHTML=Object.keys(S.cats).map(c=>`<option>${esc(c)}</option>`).join('');
  $('#cat').value=t?t.cat:AP().cat;
  fillSubs(t?t.sub:(AP().sub==='*'?(S.cats[AP().cat][0]||''):AP().sub));
  $('#md').value=t?t.mode:(/fx|one/i.test(AP().cat)?'once':'loop');
  $('#kb').dataset.code=t?.key||'';$('#kb').value=t?.key?kl(t.key):'';d.showModal();
}
$('#cat').onchange=()=>fillSubs();
$('#cx').onclick=e=>{e.preventDefault();$('#dlg').close()};
$('#ok').onclick=e=>{
  e.preventDefault();const id=$('#dlg').dataset.id,cat=$('#cat').value,sub=$('#sub').value,mode=$('#md').value,n=$('#nm').value.trim();
  if(id){const t=byId(id);Object.assign(t,{name:n||t.name,cat,sub,mode});setKeyFrom(t);save();$('#dlg').close();render();return}
  const u=$('#url').value.trim(),vid=parseId(u);
  if(!vid){$('#e2').textContent='No pude leer ese link. Probá con youtube.com/watch?v=… o youtu.be/…';return}
  const t={id:Date.now().toString(36),vid,start:parseStart(u),name:n||'Cargando…',auto:!n,vol:60,mode,cat,sub};
  setKeyFrom(t);S.tracks.push(t);save();if(apiReady)mount(t);
  {const P=AP(),all=P.cat===cat&&P.sub==='*';P.cat=cat;P.sub=all?'*':sub}save();$('#dlg').close();render();
};
$('#del').onclick=e=>{
  e.preventDefault();const id=$('#dlg').dataset.id;
  try{players[id]?.destroy()}catch(x){}
  delete players[id];delete st[id];document.getElementById('p'+id)?.remove();
  S.tracks=S.tracks.filter(t=>t.id!==id);save();$('#dlg').close();render();
};

/* ---------- controles generales ---------- */
$('#addBtn').onclick=()=>openDlg(null);
$('#stopAll').onclick=()=>S.tracks.forEach(t=>players[t.id]?.pauseVideo());
$('#master').value=S.master;$('#fade').value=S.fade;$('#sz').value=S.size;document.body.dataset.size=S.size;
$('#master').oninput=e=>{S.master=+e.target.value;S.tracks.forEach(t=>players[t.id]?.setVolume(eff(t)));save()};
$('#fade').onchange=e=>{S.fade=+e.target.value;save()};
$('#sz').onchange=e=>{S.size=e.target.value;document.body.dataset.size=S.size;save()};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='consola-dnd.json';a.click()};
$('#imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j.cats||!Array.isArray(j.tracks))throw 0;localStorage.setItem(KEY,JSON.stringify(j));location.reload()}
  catch(x){msg('Ese archivo no es una consola exportada válida.')}
};

$('#np').value=S.panes.length;
$('#np').onchange=e=>{const n=+e.target.value,cs=Object.keys(S.cats);while(S.panes.length<n)S.panes.push({cat:cs[S.panes.length%cs.length],sub:'*'});S.panes.length=n;if(ap>=n)ap=0;save();render()};
if(location.protocol==='file:')msg('Abierto desde disco: YouTube va a dar «Error 153». Subilo a un hosting (GitHub Pages) o usá un servidor local.');
render();
const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
window.onYouTubeIframeAPIReady=()=>{apiReady=true;S.tracks.forEach(mount)};
</script>
</body>
</html>
